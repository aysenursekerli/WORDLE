<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>PAÜ BAHAR ŞENLİĞİ WORDLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Arka Plan Animasyonları -->
    <div class="background-patterns">
        <span class="bg-icon bg-icon-1">💻</span>
        <span class="bg-icon bg-icon-2">⌨️</span>
        <span class="bg-icon bg-icon-3">🖱️</span>
        <span class="bg-icon bg-icon-4">💾</span>
        <span class="bg-icon bg-icon-5">🖥️</span>
        <span class="bg-icon bg-icon-6">📱</span>
        <span class="bg-icon bg-icon-7">🎧</span>
        <span class="bg-icon bg-icon-8">⚙️</span>
    </div>

    <!-- Çimen Animasyonları -->
    <div class="grass-layer"></div>



    <div class="main-container">

        <div class="left-panel side-panel">
            <div id="level-indicator">Seviye 1: Kolay</div>
            <div id="timer">00:00</div>
        </div>

        <div class="right-panel side-panel">
            <button id="theme-toggle" title="Karanlık Mod Aç/Kapat">🌙</button>
        </div>

        <div class="game-wrapper">
            <h1>PAÜ BAHAR ŞENLİĞİ WORDLE</h1>
            <div id="game-board"></div>
            <div id="keyboard-container"></div>
        </div>

    </div>

    <div id="game-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button id="modal-btn">Yeni Oyun</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
